name: M0 checks

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bundles are declared per platform: `targets: "all"` made every CI
          # host attempt AppImage, whose AppRun download failed from the M0
          # network and failed the Linux job on its own (M0-validation).
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the single trusted build host (Node 26) so the CI lockfile
          # install cannot diverge from the shipped artifacts' toolchain.
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
        working-directory: .
      - run: npm ci
      - run: npm run build
      - run: npm run test:fixture
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
