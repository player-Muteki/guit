name: Release

# Publishing a version is a deliberate act: push a tag like `v0.1.0`.
# Everything lands in a DRAFT GitHub release — a human reviews and
# publishes. Until the Windows/macOS runtime lanes are actually exercised,
# the release body states the verified platform scope explicitly.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run build
      - run: npm run test:fixture
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Collect bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/macos/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

  draft:
    needs: bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - name: Release body (verified scope stated)
        # Event data reaches the shell only through env, never interpolation.
        env:
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          ## Verified / unverified platforms

          - **Linux** — install trial, click-through and recovery smoke verified on
            Ubuntu 26.04 (see \`plan/M6-validation.md\` in the repository).
          - **macOS / Windows** — artifacts are built by this pipeline but have
            **not** been runtime-verified; treat them as untested previews.

          Changes: https://github.com/${REPO}/blob/master/CHANGELOG.md
          EOF
      # gh is preinstalled on runners; a draft release keeps publication human.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --draft --title "guit ${GITHUB_REF_NAME}" --notes-file notes.md dist/*
