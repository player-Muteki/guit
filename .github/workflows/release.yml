name: Release

# Publishing a version is a deliberate act: push a tag like `v0.0.1`.
# The release is published after bundle builds succeed. macOS is deliberately
# left out of this matrix: a `git mergetool` continuous-integration case is
# still red on that runner, and because `publish` needs the whole matrix, one
# red leg would hold the release behind it. macOS is still built and tested by
# the CI workflow on every push; it is only withheld from the published
# packages until its lane is green. The release body states the verified
# platform scope explicitly.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run build
      - run: npm run test:fixture
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
      - name: Collect bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

  publish:
    needs: bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - name: Release body (verified scope stated)
        # Event data reaches the shell only through env, never interpolation.
        env:
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          ## Verified / unverified platforms

          - **Linux** — install trial, click-through and recovery smoke verified on
            Ubuntu 26.04 with WebKitGTK / GTK 3, on that one host only.
          - **Windows** — the release executable was driven in a real window against a
            disposable repository: the saved session reopened, a file-system change
            appeared with no user action, and a stage/unstage round-trip agreed with
            git status. Multi-monitor and non-default scale factors were not exercised,
            and no real external diff or merge tool was launched (tests use a stand-in).
          - **macOS** — not shipped in this release. A git mergetool test is still red
            on that runner, so macOS is left out of the published packages while the CI
            workflow keeps building and testing it on every push.

          Changes: https://github.com/${REPO}/blob/master/CHANGELOG.md
          EOF
      # gh is preinstalled on runners; the tag publishes after all bundles finish.
      # This job checks out nothing, so gh is not inside a git repository and
      # cannot infer one from a remote; GH_REPO names the repository directly.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' -t assets < <(find dist -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No bundle artifacts were produced" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --title "guit ${GITHUB_REF_NAME}" --notes-file notes.md
