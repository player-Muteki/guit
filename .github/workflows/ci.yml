name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the superseded run (the matrix
# build is minutes-long; stale results are never actionable).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bundles are declared per platform: `targets: "all"` made every CI
          # host attempt AppImage, whose AppRun download failed from the M0
          # network and failed the Linux job on its own (M0-validation).
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the single trusted build host (Node 26) so the CI lockfile
          # install cannot diverge from the shipped artifacts' toolchain.
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cargo target-dir reuse across runs; the release build below dominates
      # wall time, and unchanged dependency crates never recompile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run build
      - run: npm run test:fixture
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # The verified baseline is a fixed set of pre-existing warnings, so
      # clippy runs without -D warnings; new code must not add to the list
      # (checked by the warning count in the log, not enforced here).
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
