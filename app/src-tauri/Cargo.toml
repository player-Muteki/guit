[package]
name = "guit"
version = "0.0.1"
description = "Lightweight Git desktop client"
license = "MIT"
edition = "2021"

[features]
# Without this the binary points its webview at `devUrl` instead of serving the
# embedded frontend, and a plain `cargo build --release` or `cargo test
# --release` silently produces a binary that only works next to a Vite server.
# Build anything meant to be launched with `npm run bin:release`, which turns
# this on; `tauri dev` builds with --no-default-features and needs it off.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
notify = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
